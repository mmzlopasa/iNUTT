name: Build Android & Windows

on:
  push:
    branches: [main, "claude/**"]
    paths: ["cross/**", ".github/workflows/cross.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cross-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cross
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Patch webview plugin for the current Android Gradle plugin
        # flutter_inappwebview_android 1.1.3 asks for proguard-android.txt, which AGP no longer accepts.
        run: |
          find "${PUB_CACHE:-$HOME/.pub-cache}" -path "*flutter_inappwebview_android-*/android/build.gradle" \
            -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} +
      - run: flutter test
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../inutt.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: inutt.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cross
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ github.run_number }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build launcher
        # The top folder holds only iNUTT.exe (this small launcher) and the "app" folder with everything else.
        shell: cmd
        working-directory: cross/windows/launcher
        run: |
          rc /nologo /fo launcher.res launcher.rc || exit /b 1
          cl /nologo /O2 /EHsc /std:c++17 /DUNICODE /D_UNICODE launcher.cpp launcher.res /Fe:iNUTT.exe /link /SUBSYSTEM:WINDOWS user32.lib shell32.lib ole32.lib || exit /b 1
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\out\iNUTT\app | Out-Null
          Copy-Item -Recurse -Force build\windows\x64\runner\Release\* ..\out\iNUTT\app\
          Copy-Item -Force windows\launcher\iNUTT.exe ..\out\iNUTT\iNUTT.exe
          # The Visual C++ runtime goes along, so PCs without it installed still start the app.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item -Force "$env:WINDIR\System32\$dll" ..\out\iNUTT\app\
          }
          Get-ChildItem ..\out\iNUTT | Format-Table Name
          Compress-Archive -Path ..\out\iNUTT -DestinationPath ..\iNUTT-windows.zip -Force
      - name: Smoke test (the app must still be running after 25 s)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath ..\out\iNUTT\iNUTT.exe -PassThru
          Start-Sleep -Seconds 25
          Get-Process | Where-Object { $_.ProcessName -like 'iNUTT*' } | Format-Table Id, ProcessName, Path, MainWindowTitle -AutoSize
          Get-ChildItem -Path $env:APPDATA, $env:LOCALAPPDATA -Recurse -Filter startup.log -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-3) } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'iNUTT' } | Format-List TimeCreated, ProviderName, Id, Message
          $alive = Get-Process -Name iNUTT -ErrorAction SilentlyContinue | Where-Object { $_.Path -like '*\app\iNUTT.exe' }
          Get-Process -Name iNUTT -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $alive) { Write-Error 'iNUTT exited during start-up' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: iNUTT-windows.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly-cross --yes --cleanup-tag || true
          gh release create nightly-cross inutt.apk iNUTT-windows.zip --prerelease \
            --target "$GITHUB_SHA" --title "iNUTT for Android & Windows (latest)" \
            --notes "Android: install inutt.apk. Windows: unzip iNUTT-windows.zip, then run iNUTT.exe in the unzipped folder (everything else is in its app folder)."
